<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Major 2 Grammar Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: an exam answer sheet. Booklet-cover header, builder panel on the left, one question sheet on the right with an answer grid on top. */
:root {
  --paper: #E9EDF2;
  --sheet: #FFFFFF;
  --ink: #17202B;
  --muted: #586472;
  --rule: #CFD7E0;
  --form: #2456A4;
  --form-soft: #E2EAF6;
  --ok: #1D7447;
  --ok-soft: #E1F1E8;
  --bad: #B3261E;
  --bad-soft: #FAE6E3;
  --mark: #F3DC66;
  --on-solid: #FFFFFF;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151B; --sheet: #182029; --ink: #E5EAF0; --muted: #98A4B2; --rule: #2C3643;
    --form: #86ABEA; --form-soft: #1E2B40; --ok: #5DC08B; --ok-soft: #15301F; --bad: #F08A7E; --bad-soft: #3A1C19;
    --mark: #6E5F1C; --on-solid: #0E141A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151B; --sheet: #182029; --ink: #E5EAF0; --muted: #98A4B2; --rule: #2C3643;
  --form: #86ABEA; --form-soft: #1E2B40; --ok: #5DC08B; --ok-soft: #15301F; --bad: #F08A7E; --bad-soft: #3A1C19;
  --mark: #6E5F1C; --on-solid: #0E141A; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--display); font-variation-settings: "wdth" 100; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--form); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }

/* booklet cover */
.cover { background: var(--sheet); border: 1px solid var(--rule); border-top: 6px solid var(--form); border-radius: 6px; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: end; justify-content: space-between; }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--form); }
h1 { margin: 6px 0 0; font-family: var(--display); font-variation-settings: "wdth" 72; font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: .95; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.spec { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.spec div { display: grid; gap: 2px; }
.spec dt { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* builder */
.builder { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.builder > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-variation-settings: "wdth" 85; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
.builder > summary::-webkit-details-marker { display: none; }
.builder > summary .chev { font: 600 12px var(--mono); color: var(--muted); }
.builder[open] > summary .chev { transform: rotate(180deg); }
.bbody { padding: 0 16px 16px; display: grid; gap: 16px; }
.group { display: grid; gap: 4px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-bottom: 2px; }
.ghead b { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--form); }
.linkbtn { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.topic { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 5px 0; cursor: pointer; }
.topic input { margin: 3px 0 0; accent-color: var(--form); width: 15px; height: 15px; }
.topic .tl { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.topic .tn { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.topic .tc { font: 500 11.5px var(--mono); color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.fld { display: grid; gap: 6px; }
.fld > span { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 13px; border-left: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--form); color: var(--on-solid); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--sheet); border-radius: 6px; padding: 10px 16px; font-weight: 700; cursor: pointer; letter-spacing: .02em; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.mistakes { border: 1px dashed var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; }

/* sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.sheet-head { padding: 14px 20px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; align-items: center; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--form); background: var(--form-soft); padding: 6px 8px; border-radius: 4px; }
.qnum { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.clock { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.clock small { font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.clock.low { color: var(--bad); }

.grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
.cell { width: 28px; height: 26px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); font: 500 11px var(--mono); color: var(--muted); cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.cell.done { background: var(--form-soft); color: var(--form); border-color: var(--form-soft); }
.cell.ok { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.cell.no { background: var(--bad); border-color: var(--bad); color: var(--on-solid); }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 1px; color: var(--ink); }

.qbody { padding: 22px 20px 8px; display: grid; gap: 18px; }
.instr { margin: 0; font: 600 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stem { margin: 0; font-family: var(--body); font-size: clamp(19px, 2.4vw, 23px); line-height: 1.55; max-width: 62ch; text-wrap: pretty; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); transform: translateY(-3px); height: 1em; }
.blank.filled { min-width: 0; border-bottom-color: var(--form); height: auto; transform: none; padding: 0 2px; color: var(--form); font-weight: 600; }
.part { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; padding: 0 1px; }
.part sub { font: 600 11px var(--mono); color: var(--form); margin-left: 2px; vertical-align: -0.35em; text-decoration: none; display: inline-block; }
.part.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); }
.part.badpart { text-decoration-color: var(--bad); color: var(--bad); }

.opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.opt { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 11px 14px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; cursor: pointer; font-family: var(--body); font-size: 17px; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--form); }
.opt:disabled { cursor: default; }
.bub { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1.5px solid var(--form); color: var(--form); display: grid; place-items: center; font: 600 13px var(--mono); }
.opt .otext { min-width: 0; overflow-wrap: anywhere; }
.opt.picked { border-color: var(--ink); }
.opt.picked .bub { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bub { background: var(--ok); border-color: var(--ok); color: var(--on-solid); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--on-solid); }
.opt .tag { margin-left: auto; font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; flex: none; }
.opt.right .tag { color: var(--ok); }
.opt.wrong .tag { color: var(--bad); }

.why { border-left: 3px solid var(--form); background: var(--form-soft); padding: 12px 14px; border-radius: 0 6px 6px 0; display: grid; gap: 4px; max-width: 70ch; }
.why b { font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--form); }
.why.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.why.ok b { color: var(--ok); }
.why.no { border-left-color: var(--bad); background: var(--bad-soft); }
.why.no b { color: var(--bad); }
.why p { margin: 0; }

.foot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font: 500 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }
.foot .acts { display: flex; gap: 8px; margin-left: auto; }

/* results */
.res { padding: 22px 20px; display: grid; gap: 22px; }
.score { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; }
.big { font-family: var(--display); font-variation-settings: "wdth" 70; font-weight: 800; font-size: clamp(56px, 10vw, 88px); line-height: .85; font-variant-numeric: tabular-nums; }
.big small { font-size: .42em; color: var(--muted); font-weight: 700; }
.verdict { display: grid; gap: 4px; }
.verdict strong { font-size: 18px; }
.verdict span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 4px 12px; align-items: center; }
.bar .bl { font-size: 13.5px; font-weight: 600; }
.bar .bl span { font-weight: 400; color: var(--muted); }
.bar .bv { font: 600 12.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ok); border-radius: 4px; }
.bar .fill.mid { background: var(--form); }
.bar .fill.low { background: var(--bad); }
h2 { margin: 0; font-variation-settings: "wdth" 80; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
.missed { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.missed li { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; }
.missed .stem { font-size: 17px; }
.ans { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; }
.ans .y { color: var(--bad); }
.ans .c { color: var(--ok); font-weight: 600; }
.ans .y::before, .ans .c::before { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
.ans .y::before { content: "You"; }
.ans .c::before { content: "Answer"; }
.missed .rule { margin: 0; color: var(--muted); font-size: 13.5px; }
.ractions { display: flex; gap: 8px; flex-wrap: wrap; }
.note { margin: 0; color: var(--muted); font-size: 12.5px; }

@media (max-width: 520px) {
  .sheet-head, .grid, .qbody, .foot, .res { padding-left: 14px; padding-right: 14px; }
  .keys { display: none; }
  .opt { font-size: 16px; padding: 10px 12px; gap: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .cell, .seg button { transition: background-color .15s, border-color .15s, color .15s; }
}

/* tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 700; font-variation-settings: "wdth" 85; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.tab .n { font: 600 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-selected="true"] .n { color: var(--sheet); opacity: .75; }
.tab .dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: var(--on-solid); font: 600 11px/20px var(--mono); text-align: center; }
.layout.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 520px) {
  .tabs { gap: 4px; flex-wrap: nowrap; }
  .tab { flex: 1 1 auto; justify-content: center; padding: 9px 8px; font-size: 12px; letter-spacing: .02em; }
  .tab .n { display: none; }
}
.sync { display: inline-flex; gap: 6px; align-items: center; font: 600 11px/1.2 var(--mono); letter-spacing: .04em; color: var(--muted); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.on { color: var(--ok); }
.sync.on::before { background: var(--ok); }
.mhead { padding: 20px; display: grid; gap: 14px; border-bottom: 1px solid var(--rule); }
.mhead p { margin: 0; color: var(--muted); max-width: 68ch; }
.mtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.mfilter { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.mfilter[aria-pressed="true"] { background: var(--form); border-color: var(--form); color: var(--on-solid); }
.copybox { display: grid; gap: 8px; }
.copybox textarea { width: 100%; min-height: 160px; font: 13px/1.45 var(--mono); padding: 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); resize: vertical; }
.toast { font-size: 13px; color: var(--ok); font-weight: 600; }
.mlist { padding: 20px; display: grid; gap: 22px; }
.mgroup { display: grid; gap: 10px; }
.mgroup h2 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.mgroup h2 span { font: 600 12px var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
.times { font: 600 11px var(--mono); color: var(--bad); }
.empty { padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }
</style>

<div class="wrap">
  <header class="cover">
    <div>
      <div class="eyebrow">ENGL020 · Major 2 · Use of English</div>
      <h1 id="pageTitle">Grammar Drill</h1>
    </div>
    <dl class="spec" id="spec"></dl>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab" role="tab" id="tab-g" data-view="g">Grammar <span class="n" id="n-g"></span></button>
    <button type="button" class="tab" role="tab" id="tab-v" data-view="v">Vocabulary <span class="n" id="n-v"></span></button>
    <button type="button" class="tab" role="tab" id="tab-m" data-view="m">My mistakes <span class="dot" id="n-m" hidden></span></button>
  </nav>

  <div class="layout" id="layout">
    <details class="builder" id="builder" open>
      <summary>Build a quiz <span class="chev">▾</span></summary>
      <div class="bbody">
        <div class="group" id="grpA"></div>
        <div class="group" id="grpB"></div>
        <div class="fld">
          <span>Questions</span>
          <div class="seg" id="countSeg" role="group" aria-label="Number of questions"></div>
        </div>
        <div class="fld">
          <span>Mode</span>
          <div class="seg" id="modeSeg" role="group" aria-label="Mode">
            <button type="button" id="modePractice" data-mode="practice">Practice</button>
            <button type="button" id="modeExam" data-mode="exam">Timed exam</button>
          </div>
          <p class="hint" id="modeHint"></p>
        </div>
        <button class="btn wide" type="button" id="startBtn">Start quiz</button>
        <span class="sync" id="syncNote"></span>
      </div>
    </details>

    <main class="sheet" id="sheet" aria-live="polite"></main>
  </div>
</div>

<script>
const TOPICS = [
  { id: "S1",  src: "Prep TOEFL", label: "Skills 1–5",   name: "Subjects & verbs, appositives, prepositions, -ing / V3 adjectives" },
  { id: "S6",  src: "Prep TOEFL", label: "Skills 6–8",   name: "Joining clauses: coordinate conjunctions & adverb connectors" },
  { id: "S9",  src: "Prep TOEFL", label: "Skills 9–12",  name: "Noun clauses & relative clauses" },
  { id: "S13", src: "Prep TOEFL", label: "Skills 13–14", name: "Reduced relative & reduced adverb clauses" },
  { id: "S15", src: "Prep TOEFL", label: "Skills 15–19", name: "Inversion" },
  { id: "S20", src: "Prep TOEFL", label: "Skills 20–23", name: "Subject–verb agreement" },
  { id: "S24", src: "Prep TOEFL", label: "Skills 24–26", name: "Parallel structure" },
  { id: "S27", src: "Prep TOEFL", label: "Skills 27–29", name: "Comparatives & superlatives" },
  { id: "S30", src: "Prep TOEFL", label: "Skills 30–32", name: "Verb forms after modals, be and have" },
  { id: "L5",  src: "Life", label: "Unit 5", name: "Verb + -ing or to + infinitive" },
  { id: "L6",  src: "Life", label: "Unit 6", name: "Negative forms & question forms" },
  { id: "L7",  src: "Life", label: "Unit 7", name: "Zero & first conditionals, time linkers, used to / would / be used to" },
  { id: "L8",  src: "Life", label: "Unit 8", name: "Second, third & mixed conditionals, wish & if only" }
];

// k: "c" = complete the sentence (blank is ______), "e" = find the error ([[...]] marks parts A–D)
// a: index of the correct option. w: the rule.
const BANK = [
  // ---------- Skills 1–5
  { t: "S1", k: "c", q: "______ in the Arctic during the winter months.",
    o: ["The temperature drops sharply", "Dropping sharply the temperature", "The sharp drop of the temperature", "Because the temperature drops sharply"], a: 0,
    w: "Every sentence needs a subject and a verb. Only A gives both. D starts with because, so it is a dependent clause with no main clause." },
  { t: "S1", k: "c", q: "In 1903, the Wright brothers ______ the first powered flight.",
    o: ["making", "made", "who made", "to make"], a: 1,
    w: "The subject the Wright brothers needs a main verb. -ing forms, to + V1 and who-clauses cannot be the main verb." },
  { t: "S1", k: "e", q: "The bridge [[constructed]] in 1932 and [[is]] still [[used]] by [[thousands]] of drivers every day.",
    a: 0, w: "The bridge did not construct anything; it was constructed. A passive verb needs be + V3: was constructed." },
  { t: "S1", k: "c", q: "______, Riyadh is home to more than seven million people.",
    o: ["It is the capital of Saudi Arabia", "The capital of Saudi Arabia", "The capital of Saudi Arabia is", "Because the capital of Saudi Arabia"], a: 1,
    w: "An appositive is a noun phrase that describes the subject with no verb of its own. A and C add a second verb and create a comma splice." },
  { t: "S1", k: "c", q: "Marie Curie, ______, won two Nobel Prizes.",
    o: ["she was a physicist and chemist", "was a physicist and chemist", "a physicist and chemist", "who a physicist and chemist"], a: 2,
    w: "Between the commas you need an appositive: a noun phrase with no subject or verb. who would need a verb (who was…)." },
  { t: "S1", k: "c", q: "Despite ______, the match continued.",
    o: ["it was raining heavily", "the heavy rain", "the rain was heavy", "rained heavily"], a: 1,
    w: "Despite is a preposition. A preposition is followed by a noun (its object), never by a full clause." },
  { t: "S1", k: "c", q: "With his new phone, ______ photos of the whole trip.",
    o: ["took Ken", "Ken took", "taking Ken", "Ken taking"], a: 1,
    w: "his new phone is the object of the preposition with. It is never the subject, so the sentence still needs its own subject + verb: Ken took." },
  { t: "S1", k: "c", q: "The results of the experiment were ______, so the scientists repeated it.",

  { t: "S1", k: "e", q: "Every morning, the cleaners [[washes]] the floors [[before]] the students [[arrive]] [[at]] school.",

  { t: "S1", k: "c", q: "______, a city in the Eastern Province, is known for its oil industry.",

  { t: "S1", k: "c", q: "The Burj Khalifa, ______ in the world, is in Dubai.",

  // ---------- Skills 6–8
  { t: "S6", k: "c", q: "I wanted to buy the jacket, ______ it was too expensive.",

  { t: "S6", k: "e", q: "Since the road [[was]] closed, [[so]] we [[took]] a [[different]] route.",

  // ---------- Skills 9–12
  { t: "S9", k: "c", q: "I don't know ______ the meeting will start.",

  { t: "S9", k: "e", q: "Nobody [[understands]] [[why]] [[did the experiment fail]] [[in]] the first place.",

  var LETTERS = ["A", "B", "C", "D"];
  var COUNTS = [10, 20, 30, 0];
  var SECTION = {
    g: { title: "Grammar Drill", kindNoun: "grammar", groups: ["Prep TOEFL", "Life"],
         spec: [["Prep TOEFL", "Skills 1–30"], ["Life", "Units 5–8"], ["Exam pace", "45 s / question"]] },
    v: { title: "Vocabulary Drill", kindNoun: "vocabulary", groups: ["Reading Explorer", "Integrated Materials"],
         spec: [["Reading Explorer", "Units 5A–8B"], ["Integrated Materials", "Texts 12–23"], ["Exam pace", "45 s / question"]] }
  };

  TOPICS.forEach(function (t) { t.sec = "g"; });
  VTOPICS.forEach(function (t) { t.sec = "v"; });
  var ALLTOPICS = TOPICS.concat(VTOPICS);
  var TOPIC = {};
  ALLTOPICS.forEach(function (t) { TOPIC[t.id] = t; });

  function hash(s) { var x = 5381; for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
  var ALL = BANK.concat(VBANK);
  var BYID = {};
  ALL.forEach(function (q) {
    q.sec = TOPIC[q.t].sec;
    q.id = q.t + "-" + hash(q.q);
    if (q.k === "e") {
      q.o = [];
      q.q.replace(/\[\[(.+?)\]\]/g, function (_, s) { q.o.push(s); return s; });
    }
    BYID[q.id] = q;
  });
  function inSec(sec) { return ALL.filter(function (q) { return q.sec === sec; }); }

  // ---------- storage
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var hot = (window.claude && window.claude.hot) || null;
  var hotData = (hot && hot.data) || {};

  function defaults() {
    return {
      view: "g", mode: "practice",
      g: { topics: TOPICS.map(function (t) { return t.id; }), count: 20 },
      v: { topics: VTOPICS.map(function (t) { return t.id; }), count: 20 }
    };
  }
  var settings = hotData.settings || load("m2.settings.v2", null) || defaults();
  if (!settings.g || !settings.v) settings = defaults();
  var records = load("m2.records.v2", {});
  Object.keys(records).forEach(function (id) { if (!BYID[id]) delete records[id]; });
  var quizzes = load("m2.quizzes.v2", []);
  var states = hotData.states || { g: null, v: null };
  var mfilter = "all";
  var copyText = null, copied = false;
  var timer = null;

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function $(id) { return document.getElementById(id); }
  function persist() { save("m2.settings.v2", settings); }

  function activeMistakes(sec) {
    return Object.keys(records).filter(function (id) {
      var r = records[id];
      return r.last === 0 && (!sec || BYID[id].sec === sec);
    });
  }

  // ---------- cloud sync (claude.ai only; private to the signed-in viewer)
  var cloud = { ref: null, on: false, busy: false, dirty: false, t: null };
  function cloudBody() {
    var act = activeMistakes();
    var byLesson = {};
    act.forEach(function (id) { var t = TOPIC[BYID[id].t]; var k = t.src + " " + t.label; byLesson[k] = (byLesson[k] || 0) + 1; });
    return {
      version: 2,
      updated: new Date().toISOString(),
      records: records,
      quizzes: quizzes.slice(-40),
      summary: { activeMistakes: act.length, byLesson: byLesson },
      mistakes: act.slice(0, 150).map(function (id) {
        var q = BYID[id], r = records[id], t = TOPIC[q.t];
        return { section: q.sec === "g" ? "grammar" : "vocabulary", lesson: t.src + " " + t.label + " · " + t.name,
          question: plainStem(q), yourAnswer: r.lp == null ? "no answer" : q.o[r.lp], correct: q.o[q.a], timesWrong: r.w };
      })
    };
  }
  function mergeRemote(data) {
    if (!data) return;
    var rr = data.records || {};
    Object.keys(rr).forEach(function (id) {
      if (!BYID[id]) return;
      if (!records[id] || (rr[id].at || 0) > (records[id].at || 0)) records[id] = rr[id];
    });
    var seen = {};
    quizzes = quizzes.concat(data.quizzes || []).filter(function (z) { if (!z || seen[z.at]) return false; seen[z.at] = 1; return true; })
      .sort(function (a, b) { return a.at - b.at; }).slice(-40);
    save("m2.records.v2", records); save("m2.quizzes.v2", quizzes);
  }
  function startCloud() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (caps) {
      var db = caps[0], user = caps[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        cloud.ref = db.doc("data/users/" + id + "/progress");
        return cloud.ref.get().then(function (snap) {
          if (snap.exists) mergeRemote(snap.data());
          cloud.on = true;
          queueSync();
          paintAll();
        });
      });
    }).catch(function () { cloud.ref = null; cloud.on = false; paintSync(); });
  }
  function queueSync() {
    if (!cloud.ref) return;
    cloud.dirty = true;
    clearTimeout(cloud.t);
    cloud.t = setTimeout(flushSync, 2500);
  }
  function flushSync() {
    if (!cloud.ref || cloud.busy || !cloud.dirty) return;
    cloud.busy = true; cloud.dirty = false;
    cloud.ref.set(cloudBody()).then(function () { cloud.on = true; }, function (e) {
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { cloud.ref = null; cloud.on = false; }
      else cloud.dirty = true;
    }).then(function () { cloud.busy = false; paintSync(); if (cloud.dirty) { clearTimeout(cloud.t); cloud.t = setTimeout(flushSync, 8000); } });
  }
  function syncText() {
    return cloud.on ? "Saved to your Claude account. Claude can read your mistakes." : "Saved on this device only.";
  }
  function paintSync() {
    var n = $("syncNote");
    if (n) { n.textContent = syncText(); n.classList.toggle("on", cloud.on); }
    var m = $("mSync");
    if (m) { m.textContent = syncText(); m.classList.toggle("on", cloud.on); }
  }

  function record(id, pick) {
    var q = BYID[id], ok = pick === q.a;
    var r = records[id] || { w: 0, r: 0, last: 1, lp: null, at: 0 };
    if (ok) { r.r++; r.last = 1; } else { r.w++; r.last = 0; r.lp = pick === undefined ? null : pick; }
    r.at = Date.now();
    records[id] = r;
    save("m2.records.v2", records);
    queueSync();
  }

  // ---------- header + tabs
  function paintChrome() {
    var v = settings.view;
    ["g", "v", "m"].forEach(function (k) { $("tab-" + k).setAttribute("aria-selected", String(v === k)); });
    $("n-g").textContent = inSec("g").length;
    $("n-v").textContent = inSec("v").length;
    var am = activeMistakes().length;
    $("n-m").hidden = am === 0;
    $("n-m").textContent = am;
    var sec = SECTION[v === "m" ? "g" : v];
    $("pageTitle").textContent = v === "m" ? "My Mistakes" : sec.title;
    var spec = v === "m"
      ? [["Grammar", activeMistakes("g").length + " to fix"], ["Vocabulary", activeMistakes("v").length + " to fix"], ["Quizzes done", String(quizzes.length)]]
      : sec.spec.concat([["Bank", inSec(v).length + " questions"]]);
    $("spec").innerHTML = spec.map(function (p) { return "<div><dt>" + esc(p[0]) + "</dt><dd>" + esc(p[1]) + "</dd></div>"; }).join("");
    $("layout").classList.toggle("solo", v === "m");
    $("builder").hidden = v === "m";
  }

  // ---------- builder
  function cur() { return settings[settings.view]; }
  function poolSize() { var s = cur(); return inSec(settings.view).filter(function (q) { return s.topics.indexOf(q.t) > -1; }).length; }
  function renderBuilder() {
    if (settings.view === "m") return;
    var sec = settings.view, s = cur(), conf = SECTION[sec];
    var list = sec === "g" ? TOPICS : VTOPICS;
    [["grpA", conf.groups[0]], ["grpB", conf.groups[1]]].forEach(function (g) {
      var ts = list.filter(function (t) { return t.src === g[1]; });
      var allOn = ts.every(function (t) { return s.topics.indexOf(t.id) > -1; });
      var html = '<div class="ghead"><b>' + esc(g[1]) + '</b><button type="button" class="linkbtn" data-toggle="' + esc(g[1]) + '">' + (allOn ? "Clear" : "Select all") + "</button></div>";
      ts.forEach(function (t) {
        var on = s.topics.indexOf(t.id) > -1;
        var n = ALL.filter(function (q) { return q.t === t.id; }).length;
        html += '<label class="topic" for="tp-' + t.id + '"><input type="checkbox" id="tp-' + t.id + '" data-topic="' + t.id + '"' + (on ? " checked" : "") + ">" +
          '<span class="tl">' + esc(t.label) + '<span class="tn">' + esc(t.name) + '</span></span><span class="tc">' + n + "</span></label>";
      });
      $(g[0]).innerHTML = html;
    });
    $("countSeg").innerHTML = COUNTS.map(function (c) {
      return '<button type="button" id="cnt-' + c + '" data-count="' + c + '" aria-pressed="' + (s.count === c) + '">' + (c ? c : "All") + "</button>";
    }).join("");
    $("modePractice").setAttribute("aria-pressed", String(settings.mode === "practice"));
    $("modeExam").setAttribute("aria-pressed", String(settings.mode === "exam"));
    var pool = poolSize(), n = s.count ? Math.min(s.count, pool) : pool;
    $("modeHint").textContent = settings.mode === "practice"
      ? "See the answer and the " + (sec === "g" ? "rule" : "meaning") + " after each question."
      : "Answers stay hidden until the end. You get " + fmt(n * 45) + " for " + n + " questions.";
    $("startBtn").disabled = pool === 0;
    $("startBtn").textContent = pool === 0 ? "Pick at least one topic" : "Start " + n + "-question quiz";
    paintSync();
  }

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.topic) {
      var s = cur(), id = t.dataset.topic, i = s.topics.indexOf(id);
      if (t.checked && i < 0) s.topics.push(id);
      if (!t.checked && i > -1) s.topics.splice(i, 1);
      persist(); renderBuilder();
    }
  });
  $("builder").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var s = cur();
    if (b.dataset.toggle) {
      var list = (settings.view === "g" ? TOPICS : VTOPICS).filter(function (t) { return t.src === b.dataset.toggle; }).map(function (t) { return t.id; });
      var allOn = list.every(function (id) { return s.topics.indexOf(id) > -1; });
      s.topics = s.topics.filter(function (id) { return list.indexOf(id) < 0; });
      if (!allOn) s.topics = s.topics.concat(list);
      persist(); renderBuilder();
    } else if (b.dataset.count !== undefined) { s.count = +b.dataset.count; persist(); renderBuilder(); }
    else if (b.dataset.mode) { settings.mode = b.dataset.mode; persist(); renderBuilder(); }
    else if (b.id === "startBtn") { start(settings.view); collapseOnPhone(); }
  });
  function collapseOnPhone() { if (window.matchMedia("(max-width: 880px)").matches) $("builder").open = false; }

  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]");
    if (!b) return;
    settings.view = b.dataset.view; persist();
    copyText = null; copied = false;
    if (settings.view !== "m" && !states[settings.view]) start(settings.view, null, true);
    paintAll();
    tick();
  });

  // ---------- quiz
  function st() { return settings.view === "m" ? null : states[settings.view]; }
  function start(sec, ids, quiet, label) {
    var s = settings[sec];
    var pool = ids ? ids.map(function (id) { return BYID[id]; }).filter(Boolean)
                   : inSec(sec).filter(function (q) { return s.topics.indexOf(q.t) > -1; });
    pool = shuffle(pool);
    if (!ids && s.count) pool = pool.slice(0, s.count);
    if (!pool.length) return;
    states[sec] = {
      items: pool.map(function (q) { return { id: q.id, order: q.k === "e" ? [0, 1, 2, 3] : shuffle([0, 1, 2, 3]) }; }),
      i: 0, picks: {}, mode: settings.mode, label: label || null,
      started: Date.now(), limit: settings.mode === "exam" ? pool.length * 45 : 0, done: false, ended: 0
    };
    if (settings.view !== sec) { settings.view = sec; persist(); }
    paintAll();
    tick();
    if (!quiet) $("sheet").scrollIntoView({ block: "start", behavior: "smooth" });
  }
  function elapsed(S) { return ((S.done ? S.ended : Date.now()) - S.started) / 1000; }
  function tick() {
    clearInterval(timer);
    var S = st();
    if (!S || S.done) return;
    timer = setInterval(function () {
      var S2 = st();
      if (!S2 || S2.done) { clearInterval(timer); return; }
      if (S2.mode === "exam" && S2.limit - elapsed(S2) <= 0) { finish(); return; }
      paintClock();
    }, 1000);
  }
  function paintClock() {
    var el = $("clock"), S = st();
    if (!el || !S) return;
    if (S.mode === "exam") {
      var left = S.limit - elapsed(S);
      el.innerHTML = "<small>Left</small>" + fmt(left);
      el.classList.toggle("low", left <= 60);
    } else el.innerHTML = "<small>Time</small>" + fmt(elapsed(S));
  }
  function isRight(S, it) { return S.picks[it.id] === BYID[it.id].a; }

  function plainStem(q) {
    if (q.k === "e") { var n = 0; return q.q.replace(/\[\[(.+?)\]\]/g, function (_, s) { return "(" + LETTERS[n++] + ") " + s; }); }
    return q.q;
  }
  function stemHTML(q, pick, reveal) {
    if (q.k !== "e") {
      var word = pick === undefined || pick === null ? "" : q.o[pick];
      if (word && q.q.indexOf("______") === 0) word = word.charAt(0).toUpperCase() + word.slice(1);
      var fill = word ? '<span class="blank filled">' + esc(word) + "</span>" : '<span class="blank" aria-label="blank"></span>';
      return esc(q.q).replace("______", fill);
    }
    var n = 0;
    return esc(q.q).replace(/\[\[(.+?)\]\]/g, function (_, s) {
      var idx = n++, cls = "part";
      if (pick === idx) cls += " hl";
      if (reveal && idx === q.a) cls += " badpart";
      return '<span class="' + cls + '">' + s + "<sub>" + LETTERS[idx] + "</sub></span>";
    });
  }
  function instr(q) {
    return q.k === "c" ? "Choose the answer that completes the sentence"
      : q.k === "e" ? "Choose the underlined part that is NOT correct"
      : "Choose the word that completes the sentence";
  }

  function renderQuiz() {
    var S = st(), sh = $("sheet");
    if (!S) { sh.innerHTML = ""; return; }
    if (S.done) { renderResults(); return; }
    var item = S.items[S.i], q = BYID[item.id], t = TOPIC[q.t];
    var pick = S.picks[item.id];
    var locked = S.mode === "practice" && pick !== undefined;
    var total = S.items.length;
    var grid = S.items.map(function (it, k) {
      var cls = "cell", p = S.picks[it.id];
      if (p !== undefined) cls += S.mode === "practice" ? (isRight(S, it) ? " ok" : " no") : " done";
      if (k === S.i) cls += " cur";
      return '<button type="button" class="' + cls + '" data-go="' + k + '" aria-label="Question ' + (k + 1) + '">' + (k + 1) + "</button>";
    }).join("");
    var opts = item.order.map(function (oi, pos) {
      var cls = "opt", tag = "";
      if (pick === oi) cls += " picked";
      if (locked) {
        if (oi === q.a) { cls += " right"; tag = '<span class="tag">Correct</span>'; }
        else if (pick === oi) { cls += " wrong"; tag = '<span class="tag">Your answer</span>'; }
      }
      var label = q.k === "e" ? LETTERS[oi] : LETTERS[pos];
      return '<li><button type="button" class="' + cls + '" data-pick="' + oi + '"' + (locked ? " disabled" : "") + '><span class="bub">' + label + '</span><span class="otext">' + esc(q.o[oi]) + "</span>" + tag + "</button></li>";
    }).join("");
    var why = "";
    if (locked) {
      var ok = pick === q.a;
      why = '<div class="why ' + (ok ? "ok" : "no") + '"><b>' + (ok ? "Correct" : "Not quite") + " · " + (q.sec === "g" ? "Rule" : "Meaning") + "</b><p>" + esc(q.w || q.o[q.a]) + "</p></div>";
    }
    var last = S.i === total - 1, answered = Object.keys(S.picks).length;
    sh.innerHTML =
      '<div class="sheet-head"><div class="meta"><span class="qnum">Q ' + (S.i + 1) + " / " + total + '</span><span class="chip">' + esc(t.src + " · " + t.label) + "</span>" +
      (S.label ? '<span class="chip">' + esc(S.label) + "</span>" : "") + '</div><div class="clock" id="clock"></div></div>' +
      '<nav class="grid" aria-label="Answer sheet">' + grid + "</nav>" +
      '<div class="qbody"><p class="instr">' + instr(q) + " · " + esc(t.name) + "</p>" +
      '<p class="stem">' + stemHTML(q, pick, locked) + "</p>" +
      '<ol class="opts">' + opts + "</ol>" + why + "</div>" +
      '<div class="foot"><span class="keys"><kbd>A</kbd>–<kbd>D</kbd> to answer · <kbd>Enter</kbd> next · <kbd>←</kbd> back</span><div class="acts">' +
      '<button type="button" class="btn ghost" id="prevBtn"' + (S.i === 0 ? " disabled" : "") + ">Back</button>" +
      (S.mode === "exam" && !last ? '<button type="button" class="btn ghost" id="endBtn">Finish (' + answered + "/" + total + ")</button>" : "") +
      '<button type="button" class="btn" id="nextBtn"' + (S.mode === "practice" && !locked ? " disabled" : "") + ">" + (last ? "See results" : "Next") + "</button></div></div>";
    paintClock();
  }

  function pickAnswer(oi) {
    var S = st(); if (!S || S.done) return;
    var item = S.items[S.i];
    if (S.mode === "practice" && S.picks[item.id] !== undefined) return;
    S.picks[item.id] = oi;
    if (S.mode === "practice") { record(item.id, oi); paintChrome(); }
    renderQuiz();
  }
  function go(k) { var S = st(); if (S && k >= 0 && k < S.items.length) { S.i = k; renderQuiz(); } }
  function next() { var S = st(); if (!S) return; if (S.i === S.items.length - 1) finish(); else go(S.i + 1); }
  function finish() {
    var S = st();
    if (!S || S.done) return;
    S.done = true; S.ended = Date.now();
    clearInterval(timer);
    if (S.mode === "exam") S.items.forEach(function (it) { record(it.id, S.picks[it.id]); });
    var right = S.items.filter(function (it) { return isRight(S, it); }).length;
    var lessons = {};
    S.items.forEach(function (it) { var t = TOPIC[BYID[it.id].t]; lessons[t.src + " " + t.label] = 1; });
    quizzes.push({ at: S.ended, section: settings.view === "g" ? "grammar" : "vocabulary", mode: S.mode, total: S.items.length, right: right,
      seconds: Math.round(elapsed(S)), lessons: Object.keys(lessons) });
    quizzes = quizzes.slice(-40);
    save("m2.quizzes.v2", quizzes);
    queueSync();
    paintAll();
    $("sheet").scrollIntoView({ block: "start", behavior: "smooth" });
  }

  function renderResults() {
    var S = st(), items = S.items, total = items.length;
    var right = items.filter(function (it) { return isRight(S, it); }).length;
    var pct = Math.round(right / total * 100);
    var byTopic = {};
    items.forEach(function (it) { var tid = BYID[it.id].t; byTopic[tid] = byTopic[tid] || { r: 0, n: 0 }; byTopic[tid].n++; if (isRight(S, it)) byTopic[tid].r++; });
    var bars = ALLTOPICS.filter(function (t) { return byTopic[t.id]; }).map(function (t) {
      var b = byTopic[t.id], p = Math.round(b.r / b.n * 100), cls = p >= 80 ? "" : p >= 50 ? " mid" : " low";
      return '<div class="bar"><div class="bl">' + esc(t.src + " " + t.label) + " <span>" + esc(t.name) + '</span></div><div class="bv">' + b.r + "/" + b.n + '</div><div class="track"><div class="fill' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div></div>';
    }).join("");
    var wrong = items.filter(function (it) { return !isRight(S, it); });
    var missed = wrong.map(function (it) { return missedItem(BYID[it.id], S.picks[it.id], null); }).join("");
    var verdict = pct >= 85 ? "Exam ready on these topics." : pct >= 65 ? "Solid. Review what you missed." : "Go back over the lessons below, then try again.";
    var el = elapsed(S);
    var paceNote = S.mode === "exam" ? "Timed exam · " + fmt(el) + " used of " + fmt(S.limit) : "Practice · " + fmt(el) + " · about " + Math.round(el / total) + " s per question (exam pace is 45 s)";
    $("sheet").innerHTML =
      '<div class="sheet-head"><div class="meta"><span class="qnum">Results</span><span class="chip">' + (S.label ? esc(S.label) : total + " questions") + "</span></div></div>" +
      '<div class="res"><div class="score"><div class="big">' + right + "<small>/" + total + '</small></div><div class="verdict"><strong>' + pct + "% · " + verdict + "</strong><span>" + esc(paceNote) + "</span></div></div>" +
      '<div class="ractions">' + (wrong.length ? '<button type="button" class="btn" id="retryBtn">Retry the ' + wrong.length + " I missed</button>" : "") +
      '<button type="button" class="btn ' + (wrong.length ? "ghost" : "") + '" id="againBtn">New quiz</button>' +
      '<button type="button" class="btn ghost" data-view="m" id="toMistakes">All my mistakes</button></div>' +
      '<section class="bars"><h2>By lesson</h2>' + bars + "</section>" +
      (wrong.length ? '<section style="display:grid;gap:12px"><h2>Questions to review</h2><ol class="missed">' + missed + "</ol></section>" : '<p class="note">No mistakes. Try a timed exam or add more topics.</p>') +
      "</div>";
  }

  function missedItem(q, pick, times) {
    var t = TOPIC[q.t];
    var yours = pick === undefined || pick === null ? "No answer" : (q.k === "e" ? LETTERS[pick] + " · " : "") + q.o[pick];
    var corr = (q.k === "e" ? LETTERS[q.a] + " · " : "") + q.o[q.a];
    return '<li><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="chip">' + esc(t.src + " · " + t.label) + "</span>" +
      (times ? '<span class="times">wrong ' + times + "×</span>" : "") + '</div><p class="stem">' + stemHTML(q, q.k === "e" ? pick : q.a, true) +
      '</p><div class="ans"><span class="y">' + esc(yours) + '</span><span class="c">' + esc(corr) + '</span></div><p class="rule">' + esc(q.w || "") + "</p></li>";
  }

  // ---------- my mistakes
  function buildCopy(ids) {
    var d = new Date();
    var lines = ["ENGL020 Major 2 · my mistakes (" + ids.length + ") · " + d.toDateString(), ""];
    ["g", "v"].forEach(function (sec) {
      var list = ids.filter(function (id) { return BYID[id].sec === sec; });
      if (!list.length) return;
      lines.push(sec === "g" ? "GRAMMAR" : "VOCABULARY");
      list.forEach(function (id, i) {
        var q = BYID[id], r = records[id], t = TOPIC[q.t];
        lines.push((i + 1) + ". [" + t.src + " " + t.label + "] " + plainStem(q));
        var yours = r.lp == null ? "no answer" : (q.k === "e" ? "(" + LETTERS[r.lp] + ") " : "") + q.o[r.lp];
        var corr = (q.k === "e" ? "(" + LETTERS[q.a] + ") " : "") + q.o[q.a];
        lines.push("   My answer: " + yours + " | Correct: " + corr + " | wrong " + r.w + "x");
      });
      lines.push("");
    });
    return lines.join("\n");
  }
  function renderMistakes() {
    var sh = $("sheet");
    var ids = activeMistakes(mfilter === "all" ? null : mfilter);
    ids.sort(function (a, b) { return (records[b].w - records[a].w) || (records[b].at - records[a].at); });
    var ng = activeMistakes("g").length, nv = activeMistakes("v").length;
    var head =
      '<div class="mhead"><div class="meta"><span class="sync' + (cloud.on ? " on" : "") + '" id="mSync">' + esc(syncText()) + "</span></div>" +
      "<p>A question stays here until you answer it correctly. " + (cloud.on ? "Ask Claude to look at your mistakes and it can read this list." : "To show Claude, press Copy for Claude and paste the text into your chat.") + "</p>" +
      '<div class="mtabs">' +
      ['all', 'g', 'v'].map(function (k) {
        var n = k === "all" ? ng + nv : k === "g" ? ng : nv;
        return '<button type="button" class="mfilter" data-mf="' + k + '" aria-pressed="' + (mfilter === k) + '">' + (k === "all" ? "All" : k === "g" ? "Grammar" : "Vocabulary") + " · " + n + "</button>";
      }).join("") + "</div>" +
      (ids.length ? '<div class="ractions"><button type="button" class="btn" id="mPractise">Practise these ' + ids.length + '</button><button type="button" class="btn ghost" id="mCopy">Copy for Claude</button></div>' : "") +
      (copyText ? '<div class="copybox">' + (copied ? '<span class="toast">Copied. Paste it into your chat with Claude.</span>' : '<span class="hint">Your browser blocked copying. Select all the text below and copy it.</span>') +
        '<textarea id="copyArea" readonly>' + esc(copyText) + "</textarea></div>" : "") +
      "</div>";
    if (!ids.length) {
      sh.innerHTML = head + '<div class="empty"><p>' + (quizzes.length || Object.keys(records).length ? "Nothing to fix here. Every question you got wrong has since been answered correctly." : "No mistakes yet. Do a quiz, and any question you get wrong will appear here.") +
        '</p><button type="button" class="btn" data-view="g">Go to grammar</button></div>';
      return;
    }
    var groups = {};
    ids.forEach(function (id) { var tid = BYID[id].t; (groups[tid] = groups[tid] || []).push(id); });
    var body = ALLTOPICS.filter(function (t) { return groups[t.id]; }).map(function (t) {
      return '<section class="mgroup"><h2>' + esc(t.src + " " + t.label) + " <span>" + groups[t.id].length + " · " + esc(t.name) + '</span></h2><ol class="missed">' +
        groups[t.id].map(function (id) { var r = records[id]; return missedItem(BYID[id], r.lp, r.w); }).join("") + "</ol></section>";
    }).join("");
    sh.innerHTML = head + '<div class="mlist">' + body + "</div>";
  }

  $("sheet").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.view) { settings.view = b.dataset.view; persist(); copyText = null; if (settings.view !== "m" && !states[settings.view]) start(settings.view, null, true); paintAll(); tick(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (b.dataset.mf) { mfilter = b.dataset.mf; copyText = null; renderMistakes(); return; }
    if (b.id === "mPractise") {
      var ids = shuffle(activeMistakes(mfilter === "all" ? null : mfilter));
      var g = ids.filter(function (id) { return BYID[id].sec === "g"; }), v = ids.filter(function (id) { return BYID[id].sec === "v"; });
      if (g.length && (mfilter !== "v")) start("g", g, false, "Mistake review"); else if (v.length) start("v", v, false, "Mistake review");
      return;
    }
    if (b.id === "mCopy") {
      var text = buildCopy(activeMistakes(mfilter === "all" ? null : mfilter));
      copyText = text; copied = false;
      var done = function (ok) { copied = ok; renderMistakes(); if (!ok) { var ta = $("copyArea"); if (ta) { ta.focus(); ta.select(); } } };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        else done(false);
      } catch (err) { done(false); }
      return;
    }
    var S = st(); if (!S) return;
    if (b.dataset.pick !== undefined) pickAnswer(+b.dataset.pick);
    else if (b.dataset.go !== undefined) go(+b.dataset.go);
    else if (b.id === "nextBtn") next();
    else if (b.id === "prevBtn") go(S.i - 1);
    else if (b.id === "endBtn") finish();
    else if (b.id === "retryBtn") start(settings.view, S.items.filter(function (it) { return !isRight(S, it); }).map(function (it) { return it.id; }), false, "Retry");
    else if (b.id === "againBtn") start(settings.view);
  });

  document.addEventListener("keydown", function (e) {
    var S = st();
    if (!S || S.done || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    var k = e.key.toLowerCase(), map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
    if (k in map) { pickAnswer(S.items[S.i].order[map[k]]); e.preventDefault(); }
    else if (k === "enter" || k === "arrowright") {
      var nb = $("nextBtn");
      if (nb && !nb.disabled && !(k === "enter" && tag === "button" && e.target.id !== "nextBtn")) { next(); e.preventDefault(); }
    } else if (k === "arrowleft") { go(S.i - 1); e.preventDefault(); }
  });

  function paintAll() {
    paintChrome();
    renderBuilder();
    if (settings.view === "m") renderMistakes(); else renderQuiz();
    paintSync();
  }

  if (hot && typeof hot.snapshot === "function") {
    try { hot.snapshot(function () { return { settings: settings, states: states }; }); } catch (e) {}
  }
  function boot() {
    if (!window.matchMedia("(min-width: 881px)").matches) $("builder").open = false;
    if (settings.view !== "m" && !states[settings.view]) start(settings.view, null, true);
    else { paintAll(); tick(); }
    startCloud();
  }
  if (hot && typeof hot.ready === "function") {
    hot.ready(function (d) {
      if (d && d.settings) settings = d.settings;
      if (d && d.states) states = d.states;
      boot();
    });
  } else boot();
})();
</script>

</html>
